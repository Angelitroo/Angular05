<app-navbarintro></app-navbarintro>

<div class="container-fluid login-container">
  <div class="row justify-content-center align-items-center h-100">
    <div class="col-11 col-sm-8 col-md-6 col-lg-4">
      <div class="card login-card">
        <div class="card-body">
          <h2 class="text-center mb-4">Crear Cuenta</h2>

          <form>
            <div class="mb-3">
              <div class="avatar-wrapper mb-2 mx-auto">
                <img [src]="fotoActual" alt="Foto de perfil" />
              </div>
              <div class="w-100">
                <label for="fotoUrl" class="form-label">URL de la foto de perfil</label>
                <input
                  id="fotoUrl"
                  name="fotoUrl"
                  type="url"
                  class="form-control"
                  [(ngModel)]="fotoUrl"
                  (input)="actualizarPreview()"
                  placeholder="https://..."
                />
              </div>
            </div>


            <div class="mb-3">
              <label class="form-label">Nombre</label>
              <input
                type="text"
                class="form-control"
                [(ngModel)]="nombre"
                name="nombre"
                required
              />
            </div>

            <div class="mb-3">
              <label class="form-label">Apellido</label>
              <input
                type="text"
                class="form-control"
                [(ngModel)]="apellido"
                name="apellido"
                required
              />
            </div>

            <div class="mb-3">
              <label for="email" class="form-label">Correo Electrónico</label>
              <input
                type="email"
                id="email"
                name="email"
                class="form-control"
                [(ngModel)]="email"
                required
              />
            </div>

            <div class="mb-3">
              <label for="password" class="form-label">Contraseña</label>
              <input
                type="password"
                id="password"
                name="password"
                class="form-control"
                [(ngModel)]="password"
                required
              />
            </div>

            <button
              type="button"
              class="btn btn-outline-primary w-100 mt-2"
              (click)="registrar()"
            >
              Registrarse
            </button>

            <div class="text-center mt-3">
              <a routerLink="/login" class="login-link">
                ¿Ya tienes cuenta? Inicia sesión
              </a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
