<div class="login-container">
  <div class="login-card">
    <h2>Crear Cuenta</h2>

    <form>
      <div class="input-group">
        <label for="nombre">Nombre</label>
        <input type="text" id="nombre" name="nombre" [(ngModel)]="nombre" required>
      </div>

      <div class="input-group">
        <label for="apellido">Apellido</label>
        <input type="text" id="apellido" name="apellido" [(ngModel)]="apellido" required>
      </div>

      <div class="input-group">
        <label for="email">Correo Electrónico</label>
        <input type="email" id="email" name="email" [(ngModel)]="email" required>
      </div>

      <div class="input-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" [(ngModel)]="password" required>
      </div>

      <button type="submit" class="login-btn" (click)="registrar()">Registrarse</button>

      <div class="forgot-password">
        <a routerLink="/login">¿Ya tienes cuenta? Inicia sesión</a>
      </div>
    </form>

    <button class="back-btn" (click)="goBack()">← Volver</button>
  </div>
</div>
