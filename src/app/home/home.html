<app-navbar></app-navbar>

<div class="home-background">

  <section class="hero text-center py-5">
    <h1 class="hero-title">VibeList Sevilla</h1>
    <p class="hero-subtitle">Los mejores eventos nocturnos de Sevilla en un solo lugar</p>

    <div *ngIf="esAdmin" class="mt-3">
      <a routerLink="/addevent" class="btn btn-outline-primary">Crear Evento</a>
    </div>
  </section>

  <main class="container home-container">

    <div class="row g-4">
      <div class="col-12 col-sm-6 col-md-4 col-lg-3" *ngFor="let event of eventList">
        <div class="card event-card h-100">
          <img [src]="event.image" alt="{{ event.title }}" class="card-img-top event-img" />
          <div class="card-body event-info">
            <h5 class="card-title">{{ event.title }}</h5>
            <p class="card-date">{{ event.date | date:'longDate' }}</p>

            <p class="card-text">{{ event.description }}</p>
            <a [routerLink]="['/event', event.id]" class="btn btn-outline-primary mt-2 w-100">Ver evento</a>
            <div *ngIf="esAdmin">
              <a [routerLink]="['/updatevent', event.id]" class="btn btn-outline-admin mt-2 w-100">Actualizar evento</a>
              <button
                class="btn btn-outline-danger mt-2 w-100"
                data-bs-toggle="modal"
                data-bs-target="#deleteEventModal"
                (click)="selectedEventId = event.id">
                Eliminar evento
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

  </main>
</div>

<!-- Modal de confirmación de eliminar -->
<div class="modal fade" id="deleteEventModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content custom-modal">
      <div class="modal-header border-0">
        <h5 class="modal-title">Eliminar evento</h5>
        <button type="button" class="btn-close btn-close-white"
                data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body">
        ¿Seguro que quieres eliminar este evento?
        <strong>Esta acción no se puede deshacer.</strong>
      </div>

      <div class="modal-footer border-0">
        <button class="btn btn-outline-secondary"
                data-bs-dismiss="modal">
          Cancelar
        </button>

        <button class="btn btn-outline-danger"
                data-bs-dismiss="modal"
                (click)="deleteEvent()">
          Sí, eliminar
        </button>
      </div>
    </div>
  </div>
</div>


<app-footer></app-footer>
