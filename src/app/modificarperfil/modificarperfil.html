<app-navbar></app-navbar>

<div class="container-fluid profile-container">
  <div class="row justify-content-center">
    <div class="col-12 col-sm-10 col-md-9 col-lg-10">
      <div class="card profile-card p-4">

        <div class="text-center mb-4">
          <h2 class="profile-title">Mi Perfil</h2>
          <p class="profile-subtitle">Actualiza tu información personal</p>
        </div>

        <div class="d-flex flex-column align-items-center mb-4">
          <div class="avatar-wrapper mb-2">
            <img [src]="fotoActual" alt="Foto de perfil" />
          </div>
          <div class="w-100">
            <label for="fotoUrl" class="form-label">URL de la foto de perfil</label>
            <input
              id="fotoUrl"
              name="fotoUrl"
              type="url"
              class="form-control"
              [(ngModel)]="fotoUrl"
              (input)="actualizarPreview()"
              placeholder="https://..."
            />
          </div>
        </div>

        <form>
          <div class="row g-3">
            <div class="col-md-6">
              <label for="nombre" class="form-label">Nombre</label>
              <input id="nombre" name="nombre" type="text" class="form-control" [(ngModel)]="nombre" />
            </div>
            <div class="col-md-6">
              <label for="apellido" class="form-label">Apellido</label>
              <input id="apellido" name="apellido" type="text" class="form-control" [(ngModel)]="apellido" />
            </div>
          </div>

          <div class="mt-3">
            <label for="email" class="form-label">Correo Electrónico</label>
            <input id="email" name="email" type="email" class="form-control" [(ngModel)]="email" />
          </div>

          <hr class="my-4 divider">

          <div class="mt-3">
            <label for="password" class="form-label">Nueva Contraseña</label>
            <input
              id="password"
              name="password"
              type="password"
              class="form-control"
              [(ngModel)]="password"
              placeholder="Dejar en blanco para no cambiarla"
            />
          </div>

          <button type="submit" class="btn btn-outline-primary w-100 mt-4" (click)="guardarCambios()">
            Guardar Cambios
          </button>
        </form>

      </div>
    </div>
  </div>
</div>

<app-footer></app-footer>
